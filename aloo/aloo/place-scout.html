<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Scout - Lead Generation</title>
    
    <!-- 1. Styles: Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563eb',
              secondary: '#1e40af',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>

    <!-- 2. React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <!-- 3. Application Code -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS (Inline SVGs to avoid dependencies) ---
        const Icon = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const SearchIcon = (props) => <Icon {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>;
        const MapPin = (props) => <Icon {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></Icon>;
        const Loader2 = (props) => <Icon {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;
        const CheckCircle = (props) => <Icon {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>;
        const AlertCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Icon>;
        const KeyIcon = (props) => <Icon {...props}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/><path d="M15 19l2 2"/><path d="M19 15l2 2"/></Icon>;
        const Globe = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Icon>;
        const Phone = (props) => <Icon {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></Icon>;
        const Building2 = (props) => <Icon {...props}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></Icon>;
        const ExternalLink = (props) => <Icon {...props}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></Icon>;
        const Filter = (props) => <Icon {...props}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>;
        const Trash2 = (props) => <Icon {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>;
        const FileSpreadsheet = (props) => <Icon {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></Icon>;
        const AlertTriangle = (props) => <Icon {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;
        const Check = (props) => <Icon {...props}><polyline points="20 6 9 17 4 12"/></Icon>;
        const Info = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></Icon>;

        // --- SERVICES ---
        let isScriptLoaded = false;

        const loadGoogleMapsScript = (apiKey) => {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.maps) {
                    isScriptLoaded = true;
                    resolve();
                    return;
                }
                if (document.getElementById('google-maps-script')) {
                    resolve(); 
                    return;
                }

                // Global auth handler
                window.gm_authFailure = () => {
                    const error = new Error("Google Maps Authentication Failed.");
                    error.type = 'auth';
                    reject(error);
                };

                const script = document.createElement('script');
                script.id = 'google-maps-script';
                script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places&v=weekly`;
                script.async = true;
                script.defer = true;

                script.onload = () => {
                    isScriptLoaded = true;
                    resolve();
                };
                script.onerror = () => {
                    reject(new Error("Failed to load Google Maps script (Network Error)."));
                };
                document.head.appendChild(script);
            });
        };

        const searchPlaces = async (query) => {
            if (!isScriptLoaded || !window.google) {
                throw { message: "Google Maps API not loaded.", type: 'general' };
            }

            try {
                const { Place } = await google.maps.importLibrary("places");
                const request = {
                    textQuery: query,
                    fields: ['displayName', 'formattedAddress', 'nationalPhoneNumber', 'websiteURI', 'location'],
                };

                const { places } = await Place.searchByText(request);

                if (!places || places.length === 0) return [];

                return places.map((place) => ({
                    id: place.id,
                    displayName: place.displayName,
                    formattedAddress: place.formattedAddress,
                    nationalPhoneNumber: place.nationalPhoneNumber,
                    websiteURI: place.websiteURI,
                    location: place.location,
                }));

            } catch (error) {
                console.error("Places Search Error:", error);
                let errorType = 'general';
                let errorMessage = error.message || "An error occurred during search.";
                const errorString = typeof error === 'string' ? error : (error.message || error.toString());
                
                // Specific handling for New Places API not enabled
                if (
                  errorString.includes("ApiNotActivatedMapError") || 
                  errorString.includes("LegacyApiNotActivated") ||
                  (errorString.includes("PERMISSION_DENIED") && errorString.includes("Places API (New)"))
                ) {
                  errorType = 'api';
                  errorMessage = "The 'Places API (New)' is not enabled on your API Key. Please enable it in Google Cloud Console.";
                } else if (errorString.includes("BillingNotEnabledMapError")) {
                  errorType = 'api';
                  errorMessage = "Billing is not enabled on your Google Cloud Project.";
                }

                throw { message: errorMessage, type: errorType };
            }
        };

        // --- COMPONENTS ---

        // 1. ApiKeyConfig
        const ApiKeyConfig = ({ onApiConnected }) => {
            const [keyInput, setKeyInput] = useState('');
            const [status, setStatus] = useState('idle');
            const [errorMessage, setErrorMessage] = useState('');

            const handleConnect = async () => {
                if (!keyInput.trim()) return;
                setStatus('loading');
                setErrorMessage('');

                try {
                    await loadGoogleMapsScript(keyInput);
                    setStatus('success');
                    setTimeout(() => onApiConnected(keyInput), 500);
                } catch (error) {
                    setStatus('error');
                    setErrorMessage(error.message || "Failed to connect.");
                }
            };

            if (status === 'success') {
                return (
                    <div className="bg-green-50 border border-green-200 rounded-lg p-4 flex items-center gap-3 animate-fade-in">
                        <CheckCircle className="text-green-600 h-6 w-6" />
                        <div>
                            <h3 className="font-medium text-green-900">Google Maps API Connected</h3>
                            <p className="text-sm text-green-700">Ready to search.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
                    <h2 className="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                        <KeyIcon className="h-5 w-5 text-primary" />
                        API Configuration
                    </h2>
                    <div className="flex flex-col md:flex-row gap-4">
                        <div className="flex-1">
                            <label className="sr-only">API Key</label>
                            <input
                                type="password"
                                value={keyInput}
                                onChange={(e) => setKeyInput(e.target.value)}
                                placeholder="Paste Google Maps API Key (Enable 'Places API New')"
                                className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none"
                            />
                        </div>
                        <button
                            onClick={handleConnect}
                            disabled={status === 'loading' || !keyInput}
                            className="bg-slate-900 hover:bg-slate-800 disabled:bg-slate-400 text-white px-6 py-3 rounded-lg font-medium flex items-center justify-center min-w-[140px]"
                        >
                            {status === 'loading' ? <><Loader2 className="animate-spin h-5 w-5 mr-2" /> Connecting</> : "Connect"}
                        </button>
                    </div>
                    {status === 'error' && (
                        <div className="mt-4 flex items-start gap-2 text-red-600 bg-red-50 p-3 rounded-lg text-sm">
                            <AlertCircle className="h-5 w-5 shrink-0" />
                            <span>{errorMessage}</span>
                        </div>
                    )}
                </div>
            );
        };

        // 2. FilterBar
        const FilterBar = ({ showNoWebsiteOnly, onToggleFilter, onExport, onClear, totalResults, filteredResults }) => {
            return (
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                    <div className="flex items-center gap-3">
                        <div className="bg-slate-100 p-2 rounded-md">
                            <Filter className="h-5 w-5 text-slate-600" />
                        </div>
                        <label className="flex items-center cursor-pointer select-none group">
                            <div className="relative">
                                <input type="checkbox" className="sr-only" checked={showNoWebsiteOnly} onChange={(e) => onToggleFilter(e.target.checked)} />
                                <div className={`block w-10 h-6 rounded-full transition-colors ${showNoWebsiteOnly ? 'bg-orange-500' : 'bg-slate-300'}`}></div>
                                <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${showNoWebsiteOnly ? 'translate-x-4' : 'translate-x-0'}`}></div>
                            </div>
                            <span className="ml-3 font-medium text-slate-700 group-hover:text-slate-900">
                                Only show places <span className="text-orange-600 font-bold">WITHOUT</span> websites
                            </span>
                        </label>
                    </div>
                    <div className="flex items-center gap-3">
                        <div className="text-sm text-slate-500 hidden lg:block mr-2">
                            {filteredResults} of {totalResults} loaded
                        </div>
                        <button onClick={onClear} className="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 text-slate-600 font-medium rounded-lg hover:bg-red-50 hover:text-red-600 transition-all">
                            <Trash2 className="h-4 w-4" /> Clear
                        </button>
                        <button onClick={onExport} disabled={filteredResults === 0} className="flex items-center gap-2 px-4 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 disabled:bg-slate-300 disabled:cursor-not-allowed transition-all shadow-sm">
                            <FileSpreadsheet className="h-4 w-4" /> Export CSV
                        </button>
                    </div>
                </div>
            );
        };

        // 3. ResultsTable
        const ResultsTable = ({ results, loading }) => {
            if (loading) {
                return (
                    <div className="w-full bg-white rounded-xl shadow-sm border border-slate-200 p-12 flex flex-col items-center justify-center min-h-[300px]">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
                        <p className="text-slate-500 animate-pulse">Scouting location data...</p>
                    </div>
                );
            }
            if (results.length === 0) {
                return (
                    <div className="w-full bg-white rounded-xl shadow-sm border border-slate-200 p-12 flex flex-col items-center justify-center min-h-[200px] text-center">
                        <div className="bg-slate-100 p-4 rounded-full mb-4">
                            <Building2 className="h-8 w-8 text-slate-400" />
                        </div>
                        <h3 className="text-slate-900 font-medium text-lg mb-1">No businesses found</h3>
                        <p className="text-slate-500 max-w-md">Try a different search term or location.</p>
                    </div>
                );
            }
            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-50 border-b border-slate-200 text-xs uppercase font-semibold text-slate-500 tracking-wider">
                                    <th className="px-6 py-4">Business Name</th>
                                    <th className="px-6 py-4">Website Status</th>
                                    <th className="px-6 py-4">Phone Number</th>
                                    <th className="px-6 py-4">Address</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {results.map((place, idx) => (
                                    <tr key={place.id || idx} className="hover:bg-slate-50 transition-colors">
                                        <td className="px-6 py-4">
                                            <div className="font-medium text-slate-900">{place.displayName || "Unknown Name"}</div>
                                        </td>
                                        <td className="px-6 py-4">
                                            {place.websiteURI ? (
                                                <a href={place.websiteURI} target="_blank" rel="noopener noreferrer" className="inline-flex items-center text-primary hover:text-blue-700 font-medium text-sm group">
                                                    <Globe className="h-4 w-4 mr-1.5" /> Visit
                                                    <ExternalLink className="h-3 w-3 ml-1 opacity-50" />
                                                </a>
                                            ) : (
                                                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-800 border border-orange-200">
                                                    No Website
                                                </span>
                                            )}
                                        </td>
                                        <td className="px-6 py-4 text-slate-600 text-sm">
                                            {place.nationalPhoneNumber ? <div className="flex items-center"><Phone className="h-4 w-4 mr-2 text-slate-400" />{place.nationalPhoneNumber}</div> : <span className="text-slate-400 italic">Not available</span>}
                                        </td>
                                        <td className="px-6 py-4 text-slate-600 text-sm max-w-xs">
                                            <div className="flex items-start">
                                                <MapPin className="h-4 w-4 mr-2 text-slate-400 mt-0.5 shrink-0" />
                                                <span className="truncate block">{place.formattedAddress}</span>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('google_maps_api_key') || 'AIzaSyBSkRVGAnQUQY6NFklYVQQfqUBxWX1CU2c');
            
            const handleApiConnected = (key) => {
                localStorage.setItem('google_maps_api_key', key);
                setApiKey(key);
            };
            const [searchQuery, setSearchQuery] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [places, setPlaces] = useState([]);
            const [error, setError] = useState(null);
            const [showNoWebsiteOnly, setShowNoWebsiteOnly] = useState(false);
            const [keepResults, setKeepResults] = useState(false);

            const filteredPlaces = useMemo(() => {
                if (!showNoWebsiteOnly) return places;
                return places.filter(place => !place.websiteURI);
            }, [places, showNoWebsiteOnly]);

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!searchQuery.trim() || !apiKey) return;

                setIsLoading(true);
                setError(null);

                if (!keepResults) {
                    setPlaces([]);
                }

                try {
                    const results = await searchPlaces(searchQuery);
                    setPlaces(prev => {
                        if (keepResults) {
                            // Deduplicate
                            const existingIds = new Set(prev.map(p => p.id));
                            const uniqueNew = results.filter(p => !existingIds.has(p.id));
                            return [...prev, ...uniqueNew];
                        }
                        return results;
                    });
                } catch (err) {
                    setError({ message: err.message || "Error", type: err.type || 'general' });
                } finally {
                    setIsLoading(false);
                }
            };

            const handleClear = () => {
                if (window.confirm("Clear all search results?")) {
                    setPlaces([]);
                    setSearchQuery('');
                    setError(null);
                }
            };

            const handleExport = () => {
                const headers = ["Business Name", "Website", "Phone Number", "Address"];
                const csvContent = [
                    headers.join(","),
                    ...filteredPlaces.map(p => {
                        const escape = (val) => `"${(val || '').replace(/"/g, '""')}"`;
                        return [
                            escape(p.displayName),
                            escape(p.websiteURI || 'No Website'),
                            escape(p.nationalPhoneNumber),
                            escape(p.formattedAddress)
                        ].join(",");
                    })
                ].join("\n");

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `place_scout_leads_${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 font-sans">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-primary p-1.5 rounded-lg text-white"><MapPin className="h-5 w-5" /></div>
                                <h1 className="text-xl font-bold text-slate-900">Place Scout</h1>
                            </div>
                            <div className="text-sm text-slate-500 font-medium">Lead Generation Tool</div>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-6xl mx-auto px-4 py-8">
                        {!apiKey ? (
                            <div className="max-w-2xl mx-auto mt-12">
                                <div className="text-center mb-8">
                                    <h2 className="text-3xl font-bold text-slate-900 mb-3">Get Started</h2>
                                    <p className="text-slate-600">Connect Google Maps API to start scouting.</p>
                                </div>
                                <ApiKeyConfig onApiConnected={handleApiConnected} />
                            </div>
                        ) : (
                            <div className="animate-fade-in">
                                <div className="mb-8">
                                    <form onSubmit={handleSearch} className="relative max-w-3xl mx-auto">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <SearchIcon className="h-6 w-6 text-slate-400" />
                                        </div>
                                        <input
                                            type="text"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="Search for leads (e.g., 'Roofers in Austin')..."
                                            className="block w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-xl shadow-sm text-lg outline-none focus:ring-2 focus:ring-primary"
                                        />
                                        <button
                                            type="submit"
                                            disabled={isLoading || !searchQuery.trim()}
                                            className="absolute right-2 top-2 bottom-2 bg-primary hover:bg-blue-700 text-white font-medium px-6 rounded-lg transition-colors disabled:opacity-50"
                                        >
                                            {isLoading ? "Scouting..." : "Search"}
                                        </button>
                                    </form>

                                    {/* Append Mode */}
                                    <div className="max-w-3xl mx-auto mt-3 flex items-center justify-between px-1 gap-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm text-slate-600 hover:text-slate-900 select-none group">
                                            <div className={`w-5 h-5 border rounded flex items-center justify-center transition-colors shadow-sm ${keepResults ? 'bg-primary border-primary' : 'bg-white border-slate-300'}`}>
                                                {keepResults && <Check className="h-3.5 w-3.5 text-white" />}
                                            </div>
                                            <input type="checkbox" checked={keepResults} onChange={(e) => setKeepResults(e.target.checked)} className="hidden" />
                                            <span className="font-medium">Append results (Build a list)</span>
                                        </label>
                                        <div className="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded-md">
                                            <Info className="h-3.5 w-3.5" />
                                            <span>To get 200+ leads, toggle this and search multiple areas.</span>
                                        </div>
                                    </div>

                                    {error && (
                                        <div className="max-w-3xl mx-auto mt-4 bg-red-50 border border-red-200 text-red-800 p-4 rounded-lg flex items-start gap-3 text-sm shadow-sm animate-fade-in">
                                            <AlertTriangle className="h-5 w-5 shrink-0 mt-0.5 text-red-600" />
                                            <div className="flex-1">
                                                <h3 className="font-bold text-red-900">Search Failed</h3>
                                                <p className="mt-1">{error.message}</p>
                                                {error.type === 'api' && (
                                                    <a href="https://console.cloud.google.com/google/maps-apis/api-list" target="_blank" className="mt-3 inline-flex items-center gap-2 px-4 py-2 bg-red-100 hover:bg-red-200 text-red-800 rounded-md font-medium text-xs uppercase border border-red-200">
                                                        Open Google Cloud Console <ExternalLink className="h-3 w-3" />
                                                    </a>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {(places.length > 0 || isLoading) && (
                                    <>
                                        <FilterBar 
                                            showNoWebsiteOnly={showNoWebsiteOnly} 
                                            onToggleFilter={setShowNoWebsiteOnly} 
                                            onExport={handleExport} 
                                            onClear={handleClear} 
                                            totalResults={places.length} 
                                            filteredResults={filteredPlaces.length} 
                                        />
                                        <ResultsTable results={filteredPlaces} loading={isLoading} />
                                    </>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
